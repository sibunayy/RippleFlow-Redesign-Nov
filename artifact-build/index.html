<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RippleFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/app.css">
<!-- Keep an element before #app: the prototype's <style> sat here, so #app is not :first-child (the .anim:first-child rule must not match it). -->
<noscript>RippleFlow needs JavaScript.</noscript>
<div class="app anim" id="app" aria-label="RippleFlow editor prototype">
  <header class="top" id="top"></header>
  <nav class="strip l" id="lstrip" aria-label="Tools and panels"></nav>
  <aside class="panel l" id="lpanel" aria-label="Left panel"></aside>
  <main class="vp" id="vp" aria-label="Canvas">
    <div class="stage" id="stage"></div>
    <svg class="ovl" id="ovl"></svg>
    <div class="guide v" id="gv"></div><div class="guide h" id="gh"></div>
    <div class="selbox" id="selbox" hidden><i data-hd="s" title="Drag to scale"></i><i data-hd="s" title="Drag to scale"></i><i data-hd="s" title="Drag to scale"></i><i data-hd="s" title="Drag to scale"></i><b data-hd="r" title="Drag to rotate"></b></div>
    <div class="anc" id="anc" hidden></div>
    <div class="float zoom" id="zoom" role="toolbar" aria-label="View"></div>
    <div class="float qbar" id="qbar" role="toolbar" aria-label="Quick actions"></div>
    <div class="float bbar" id="bbar" role="toolbar" aria-label="Brush"></div>
    <div class="hud" id="hud" hidden></div>
    <div class="toolhint" id="toolhint" hidden></div>
  </main>
  <aside class="panel r" id="rpanel" aria-label="Inspector"></aside>
  <nav class="strip r" id="rstrip" aria-label="Inspector panels"></nav>
  <div class="scrim" id="scrim"></div>
  <section class="tl" id="tl" aria-label="Timeline"></section>
  <div class="spd" id="spd" hidden></div>
  <canvas id="ink" aria-hidden="true"></canvas>
  <div id="layer-pop"></div>
</div>
<script type="module" src="assets/app.js"></script>

</body></html>
